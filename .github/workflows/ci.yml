name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the default GITHUB_TOKEN is read-only for all jobs.
permissions:
  contents: read

# Cancel superseded runs (also limits fork-PR resource abuse).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest   # --with-deps works on Ubuntu runners
    # GitHub's bare Ubuntu runners have no usable user namespaces, so Chromium can't launch
    # with the OS sandbox. The product fails CLOSED there by design; CI is a trusted, ephemeral
    # VM, so we take the documented opt-out for trusted environments. Real users keep the
    # secure default (sandbox on) — this only relaxes it inside CI.
    env:
      AGENTVISION_CHROMIUM_SANDBOX: "false"
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # don't leave the token on disk

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (extras pinned via the lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Install system deps for OCR/PDF/Office
        # Usually ~35s. A stalled mirror hung this step for 14+ min on two runs; retry stalled
        # fetches and cap the step so a hang fails fast instead of holding the job for hours.
        timeout-minutes: 10
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng poppler-utils \
            libreoffice-writer libreoffice-impress libreoffice-calc

      - name: Install Chromium (browser pinned by the playwright package version)
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src || true   # advisory in v1

      - name: Test
        env:
          # Deterministic rendering: animations off / fixed scale handled in code.
          AGENTVISION_LOG_LEVEL: ERROR
        run: pytest -q

      - name: Smoke (no-key demo path)
        run: agentvision check examples/broken_layout.html --json || true
